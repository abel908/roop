name: website

on:
  push:
    paths: ['invest-in-africa-website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['invest-in-africa-website/**', '.github/workflows/website.yml']

defaults:
  run:
    working-directory: invest-in-africa-website

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: invest-in-africa-website/package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test
